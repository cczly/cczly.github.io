profile:
  en:
    name: "Congcong Zhu"
    paragraphs:
      - "I work at Suzhou Institute for Advanced Research, USTC as an Associate Researcher and master supervisor in Suzhou."
      - "My research interests include Embodied AI, Physics Simulation for Robotics, Physics-informed Neural Dynamics. If you are seeking any form of academic cooperation, please feel free to email me at <strong>cczly@ustc.edu.cn</strong>. There are openings for <strong>PhD/master's students and interns</strong>."
      - "I have published in journals such as IEEE Transactions on Image Processing, IEEE Transactions on Multimedia, IEEE Transactions on Circuits and Systems for Video Technology, Pattern Recognition, and IEEE Transactions on Instrumentation and Measurement, and in conferences such as ICML, CVPR, ICCV, AAAI, and ACM MM."
  zh:
    name: "朱聪聪"
    paragraphs:
      - "我目前在中国科学技术大学苏州高等研究院任副研究员、硕士生导师。"
      - "研究方向包括具身智能、机器人仿真、物理神经动力学等。"
      - "如果您希望开展学术合作，或正在寻找博士生、硕士生、科研实习等机会，欢迎邮件联系：<strong>cczly@ustc.edu.cn</strong>。"

